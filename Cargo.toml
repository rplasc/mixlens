[workspace]
members = ["crates/mixlens-core", "crates/mixlens-cli", "src-tauri"]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true

# Keep DSP fast even in debug builds.
[profile.dev.package."*"]
opt-level = 2
